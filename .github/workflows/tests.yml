# Unit tests for Corrobora Mobile.
#
# Runs the standard-library unittest suite on Linux for the minimum
# supported Python version and the newest version tested so far.
# These are unit tests on synthetic data only; they do not establish
# forensic validity (docs/ARCHITECTURE.md, Section 5.8).
# Actions are pinned to full commit SHAs.

name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v
